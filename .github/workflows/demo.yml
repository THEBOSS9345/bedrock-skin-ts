name: Demo

# The viewer's live demo, on GitHub Pages: the single-file build on a page
# with bedrock-skin's test skin. Rebuilt when the viewer changes.
on:
  push:
    branches: [main]
    paths: ['viewer/**', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node tools/demo.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/demo-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
